name: bump version

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: version-bump-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  bump-version:
    if: >-
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync branch
        run: git pull --ff-only origin main

      - name: Check whether VERSION was changed by this push
        id: version_changed
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- VERSION | grep -qx 'VERSION'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        id: bump
        if: steps.version_changed.outputs.changed != 'true'
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          IFS=. read -r major minor patch extra <<< "$version"

          if [[ -n "${extra:-}" ]] ||
             ! [[ "$major" =~ ^[0-9]+$ ]] ||
             ! [[ "$minor" =~ ^[0-9]+$ ]] ||
             ! [[ "$patch" =~ ^[0-9]+$ ]]; then
            echo "VERSION must contain MAJOR.MINOR.PATCH, got '$version'" >&2
            exit 1
          fi

          next="${major}.${minor}.$((patch + 1))"
          printf '%s\n' "$next" > VERSION
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: steps.version_changed.outputs.changed != 'true' && steps.bump.outputs.next != ''
        run: |
          if git diff --quiet -- VERSION; then
            echo "VERSION is already current; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.bump.outputs.next }} [skip ci]"
          git push
