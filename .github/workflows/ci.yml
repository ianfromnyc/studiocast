name: ci

on:
  push:
  workflow_dispatch:
    inputs:
      require_cuda_runtime:
        description: "Run the opt-in CUDA runtime self-test that fails on CUDA smoke skips."
        required: false
        type: boolean
        default: false
      cuda_runtime_runner_labels:
        description: "JSON runs-on labels for the opt-in CUDA runtime job."
        required: false
        type: string
        default: '["self-hosted","linux","x64","gpu"]'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-ubuntu:
    name: build + tests + self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates \
            ${{ matrix.cc }} ${{ matrix.cxx }} \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            libxkbcommon-dev libpulse-dev libsqlite3-dev \
            libjpeg-turbo8-dev libpng-dev libgl1-mesa-dev

      - name: Toolchain versions
        run: |
          cmake --version
          ninja --version
          ${{ matrix.cxx }} --version

      - name: Configure (default Open CUDA / no Maxine SDK required)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSTUDIOCAST_ENABLE_OPEN_AUDIO=OFF \
            -DSTUDIOCAST_ENABLE_DLIB=OFF

      - name: Build
        run: |
          cmake --build build

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Self-test
        run: |
          ./build/studiocast-probe --self-test

  build-mint:
    name: build + tests + self-test (Linux Mint)
    runs-on: ubuntu-24.04
    container:
      image: linuxmintd/mint22-amd64:latest
    steps:
      - name: Install base tools (for checkout)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            libxkbcommon-dev libpulse-dev libpipewire-0.3-dev libsqlite3-dev \
            libjpeg-turbo8-dev libpng-dev libgl1-mesa-dev

      - name: Toolchain versions
        run: |
          cmake --version
          ninja --version
          g++ --version

      - name: Configure (default Open CUDA / no Maxine SDK required)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSTUDIOCAST_ENABLE_OPEN_AUDIO=OFF \
            -DSTUDIOCAST_ENABLE_DLIB=OFF

      - name: Build
        run: |
          cmake --build build

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Self-test
        run: |
          ./build/studiocast-probe --self-test

  build-enabled-features-no-gpu:
    name: enabled features, no GPU (ubuntu-24.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates tar \
            gcc-13 g++-13 \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            libxkbcommon-dev libpulse-dev libpipewire-0.3-dev libsqlite3-dev \
            libjpeg-turbo8-dev libpng-dev libgl1-mesa-dev \
            libblas-dev liblapack-dev \
            libdlib-dev

      - name: Install ONNX Runtime CPU package
        env:
          ORT_VERSION: 1.17.3
          ORT_ARCH: x64
          ORT_FLAVOR: cpu
        run: |
          if [[ "${ORT_FLAVOR}" == "cpu" ]]; then
            ort_name="onnxruntime-linux-${ORT_ARCH}-${ORT_VERSION}"
          else
            ort_name="onnxruntime-linux-${ORT_ARCH}-${ORT_FLAVOR}-${ORT_VERSION}"
          fi
          ort_tgz="${ort_name}.tgz"
          ort_url="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${ort_tgz}"
          ort_prefix="/opt/studiocast/onnxruntime/${ORT_VERSION}"
          ort_root="${ort_prefix}/${ort_name}"

          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${ort_tgz}" "${ort_url}"
          sudo mkdir -p "${ort_prefix}"
          sudo tar -xzf "${RUNNER_TEMP}/${ort_tgz}" -C "${ort_prefix}"

          test -f "${ort_root}/include/onnxruntime_cxx_api.h"
          ort_libdir="${ort_root}/lib"
          if [[ -d "${ort_root}/lib64" ]]; then
            ort_libdir="${ort_root}/lib64"
          fi

          if [[ ! -e "${ort_libdir}/libonnxruntime.so" ]]; then
            sofile="$(ls -1 "${ort_libdir}"/libonnxruntime.so.* | head -n 1)"
            sudo ln -sf "$(basename "${sofile}")" "${ort_libdir}/libonnxruntime.so"
          fi

          echo "${ort_libdir}" | sudo tee /etc/ld.so.conf.d/studiocast-onnxruntime.conf >/dev/null
          sudo ldconfig

          sudo mkdir -p /usr/local/lib/pkgconfig
          sudo tee /usr/local/lib/pkgconfig/onnxruntime.pc >/dev/null <<EOF
          prefix=${ort_root}
          exec_prefix=\${prefix}
          libdir=${ort_libdir}
          includedir=\${prefix}/include

          Name: onnxruntime
          Description: ONNX Runtime
          Version: ${ORT_VERSION}
          Libs: -L\${libdir} -lonnxruntime
          Cflags: -I\${includedir}
          EOF

          pkg-config --modversion onnxruntime

      - name: Toolchain versions
        run: |
          cmake --version
          ninja --version
          g++-13 --version
          pkg-config --modversion onnxruntime

      - name: Configure (enabled open features / no GPU required)
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          mkdir -p build
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSTUDIOCAST_ENABLE_OPEN_CUDA=ON \
            -DSTUDIOCAST_ENABLE_OPEN_AUDIO=ON \
            -DSTUDIOCAST_ENABLE_DLIB=ON 2>&1 | tee build/configure.log

          grep -Eq '^STUDIOCAST_ENABLE_OPEN_CUDA:BOOL=ON$' build/CMakeCache.txt
          grep -Eq '^STUDIOCAST_ENABLE_OPEN_AUDIO:BOOL=ON$' build/CMakeCache.txt
          grep -Eq '^STUDIOCAST_ENABLE_DLIB:BOOL=ON$' build/CMakeCache.txt
          grep -F 'Open CUDA backend enabled' build/configure.log
          grep -F 'Open Audio backend enabled' build/configure.log
          grep -F 'dlib found' build/configure.log
          grep -F 'native PipeWire backends enabled' build/configure.log

      - name: Build
        run: |
          cmake --build build

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Self-test
        run: |
          ./build/studiocast-probe --self-test

      # libpipewire is installed above, so the option defaults to ON and
      # nothing else in this workflow compiles the path without it. StudioCast
      # promises that build behaves as it did before the native backends, so
      # it is built and tested here as well.
      - name: Configure (native PipeWire backends off)
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          mkdir -p build-pipewire-off
          cmake -S . -B build-pipewire-off -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSTUDIOCAST_ENABLE_OPEN_AUDIO=OFF \
            -DSTUDIOCAST_ENABLE_DLIB=OFF \
            -DSTUDIOCAST_ENABLE_PIPEWIRE=OFF 2>&1 \
            | tee build-pipewire-off/configure.log

          grep -Eq '^STUDIOCAST_ENABLE_PIPEWIRE:BOOL=OFF$' \
            build-pipewire-off/CMakeCache.txt
          grep -F 'Native PipeWire backends disabled' \
            build-pipewire-off/configure.log

      - name: Build (native PipeWire backends off)
        run: |
          cmake --build build-pipewire-off

      - name: Run tests (native PipeWire backends off)
        run: |
          ctest --test-dir build-pipewire-off --output-on-failure

      - name: Self-test (native PipeWire backends off)
        run: |
          ./build-pipewire-off/studiocast-probe --self-test

  # Push CI intentionally keeps CUDA smoke skips portable on no-GPU runners.
  # Enable this only on a GPU runner when CUDA runtime failures should fail CI.
  cuda-runtime-smoke:
    name: CUDA runtime self-test (opt-in)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_cuda_runtime }}
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.cuda_runtime_runner_labels || '["ubuntu-24.04"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies + GPU ONNX Runtime
        run: |
          ./scripts/setup.sh --deps --onnxruntime-flavor gpu -y

      - name: Toolchain versions
        run: |
          cmake --version
          ninja --version
          g++ --version
          pkg-config --modversion onnxruntime
          nvidia-smi

      - name: Configure (Open CUDA runtime validation)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSTUDIOCAST_ENABLE_OPEN_CUDA=ON \
            -DSTUDIOCAST_ENABLE_OPEN_AUDIO=OFF \
            -DSTUDIOCAST_ENABLE_DLIB=OFF

      - name: Build probe
        run: |
          cmake --build build --target studiocast-probe

      - name: Portable self-test
        run: |
          ./build/studiocast-probe --self-test

      - name: Required CUDA runtime self-test
        run: |
          ./build/studiocast-probe --self-test --require-cuda-runtime

  package-smoke:
    name: package smoke (ubuntu-24.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates \
            gcc-13 g++-13 \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            libxkbcommon-dev libpulse-dev libpipewire-0.3-dev libsqlite3-dev \
            libjpeg-turbo8-dev libpng-dev libgl1-mesa-dev \
            desktop-file-utils python3

      - name: Build package smoke artifacts
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          packaging/appimage/build_appimage.sh --clean --skip-appimage \
            --build-dir "${PWD}/build/ci-package-smoke" \
            --dist-dir "${PWD}/dist/ci-package-smoke"

      - name: Verify package smoke artifacts
        run: |
          packaging/appimage/verify_bundle.sh \
            --dist-dir "${PWD}/dist/ci-package-smoke"

  # The packaging scripts are checked-in files rather than heredocs so that a
  # linter can read them. This job is that linter, so a regression such as the
  # one an unquoted glob caused cannot come back unnoticed.
  shell-lint:
    name: shellcheck (shell scripts)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The same image the packages are built in, so the ShellCheck is the one
    # the packaging targets. Which release that is moves with the image, so
    # the step below prints it and the log says what actually ran.
    container:
      image: registry.fedoraproject.org/fedora:44

    steps:
      - name: Install ShellCheck
        # git is needed by the checkout action; it is not in the base image.
        run: |
          dnf install -y --setopt=install_weak_deps=false ShellCheck git
          shellcheck --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint the shell scripts
        # -x follows a sourced file, so a helper library is read with the
        # script that uses it. Every script under packaging/ and scripts/ is
        # covered, plus the shell test suites, so a new one joins the job on
        # its own.
        #
        # A directory that is renamed away must fail the job, not leave it
        # linting the others and reporting success. find complains on stderr
        # inside a process substitution that nobody reads, so each directory
        # is asserted on its own first. The dirs array gives the assert and
        # the find one list, so a new directory cannot go in only one of them.
        # The empty-list guard is the second net: mapfile reports its own
        # status, not the status of find.
        run: |
          dirs=(packaging scripts tests)
          for dir in "${dirs[@]}"; do
            [[ -d "${dir}" ]] || { echo "no ${dir} directory"; exit 1; }
          done
          mapfile -t files < <(find "${dirs[@]}" -name '*.sh' | sort)
          (( ${#files[@]} > 0 )) || { echo "no shell scripts found"; exit 1; }
          shellcheck -x "${files[@]}"

  # The RPM build is also the only Fedora build in push CI, so it checks the
  # sources against the Fedora compiler and the Fedora Qt 6 as well.
  rpm-package-smoke:
    name: rpm package smoke (Fedora 44)
    runs-on: ubuntu-24.04
    # The build compiles StudioCast and a private dlib, so it is the longest
    # job here. Cap it, so a hung step cannot hold a runner for six hours.
    timeout-minutes: 90
    container:
      image: registry.fedoraproject.org/fedora:44

    steps:
      - name: Install base tools (for checkout and the cache)
        # actions/cache packs the cached directory with tar and zstd, and
        # neither is in the base image.
        run: |
          dnf install -y --setopt=install_weak_deps=false \
            git rpm-build rpmdevtools rpmlint dnf5-plugins tar zstd

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust the workspace
        # The checkout belongs to a different user id than this container, so
        # git refuses to read it until the workspace is a safe directory.
        # build_rpm.sh calls git archive to make the source archive.
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Cache the pinned dlib source
        # The tarball is 19 MB and the pin changes rarely, so keep it between
        # runs. --keep-downloads below tells --clean to leave it in place.
        uses: actions/cache@v4
        with:
          path: build/rpm/downloads
          key: rpm-dlib-${{ hashFiles('packaging/rpm/dlib.lock') }}

      - name: Build RPM packages
        # A container job cannot run podman, so this is the native build path.
        # --install-builddeps reads the BuildRequires from the rendered spec,
        # so the package list stays in the spec only.
        #
        # The script also downloads the dlib source pinned in
        # packaging/rpm/dlib.lock and checks its SHA256. Fedora has no dlib
        # package, so the spec builds that source as a private static library.
        # --keep-downloads keeps the cached tarball for the next run.
        run: |
          packaging/rpm/build_rpm.sh --clean --keep-downloads \
            --install-builddeps --rpmlint

      - name: Verify RPM packages
        # The job is already root inside a container, so the install test does
        # not need a container of its own.
        run: |
          packaging/rpm/verify_rpm.sh --install-test --no-container-check
